line-length = 100
target-version = "py312"

[lint]
select = [
  "E",     # pycodestyle errors
  "F",     # pyflakes (unused imports and variables)
  "I",     # import sorting
  "UP",    # modernize syntax
  "B",     # likely bugs
  "ASYNC", # mistakes in async code
]

[lint.per-file-ignores]
"app/scripts/dsa_questions.py" = ["E501"]